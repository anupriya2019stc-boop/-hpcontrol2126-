<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Selvan 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: #4a152b;
      background: linear-gradient(160deg, #fff5f9 0%, #ffe4ef 50%, #ffd2e5 100%);
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -60px;
      color: rgba(255, 125, 175, 0.36);
      filter: drop-shadow(0 6px 12px rgba(255, 105, 160, 0.2));
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.92);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      50% {
        transform: translateY(-50vh) translateX(16px) rotate(10deg) scale(1.06);
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-112vh) translateX(-14px) rotate(-10deg) scale(0.95);
        opacity: 0;
      }
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 40;
    }

    .sparkle-heart {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      z-index: 50;
      animation: sparkleBurst 1.35s ease-out forwards;
    }

    @keyframes sparkleBurst {
      0% {
        transform: translate(-50%, -50%) scale(0.45) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35) rotate(var(--rot));
        opacity: 0;
      }
    }

    .jiguna-piece {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 45;
      animation: jigunaFall var(--dur, 3.6s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes jigunaFall {
      0% {
        transform: translateY(-20px) translateX(0) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      50% {
        transform: translateY(50vh) translateX(var(--sway, 25px)) rotate(220deg) scale(1.08);
        opacity: 0.95;
      }
      100% {
        transform: translateY(108vh) translateX(calc(var(--sway, 25px) * -0.6)) rotate(460deg) scale(0.9);
        opacity: 0;
      }
    }

    .stage-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 490px;
    }

    .screen {
      display: none;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 50px rgba(214, 72, 128, 0.16);
      border-radius: 28px;
      padding: 32px 22px;
      text-align: center;
      animation: screenFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.active {
      display: block;
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lock-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff9ec4, #ff5c98);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 12px 26px rgba(255, 92, 152, 0.32);
      animation: gentlePulse 2.4s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .title-pink {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.65rem;
      color: #b51753;
      margin-bottom: 6px;
    }

    .sub-pink {
      font-size: 0.92rem;
      color: #7c3552;
      margin-bottom: 20px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #f07da8;
      background: transparent;
      transition: all 0.25s ease;
    }

    .pin-dot.filled {
      background: #ff4d8d;
      border-color: #ff4d8d;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255, 77, 141, 0.5);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 265px;
      margin: 0 auto 10px;
    }

    .key-btn {
      height: 54px;
      border-radius: 16px;
      border: 1px solid rgba(255, 143, 186, 0.45);
      background: rgba(255, 255, 255, 0.95);
      color: #b51753;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(230, 73, 128, 0.1);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .key-btn:active {
      transform: scale(0.93);
      background: #ffe0ed;
    }

    .err-msg {
      min-height: 22px;
      font-size: 0.85rem;
      color: #d62859;
      margin-top: 8px;
      font-weight: 500;
    }

    .click-hint {
      font-size: 1rem;
      font-weight: 600;
      color: #b51753;
      background: #fff0f6;
      border: 1px dashed #ff8fb8;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .smileys-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 22px;
    }

    .smiley-item {
      font-size: 3.1rem;
      line-height: 1.1;
      cursor: pointer;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.78);
      border: 1.5px solid rgba(255, 158, 196, 0.45);
      box-shadow: 0 8px 18px rgba(235, 94, 148, 0.12);
      transition: transform 0.22s ease, background 0.3s ease;
      user-select: none;
    }

    .smiley-item:hover {
      transform: scale(1.12);
    }

    .smiley-item.clicked {
      background: #ffe3ef;
      border-color: #ff6fa5;
      transform: scale(0.95);
    }

    .tease-emoji {
      font-size: 4.3rem;
      margin-bottom: 14px;
      animation: gentlePulse 2.6s ease-in-out infinite;
    }

    .tease-text {
      font-size: 1.45rem;
      font-weight: 700;
      color: #b51753;
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .btn-soft {
      background: linear-gradient(135deg, #ff6fa5, #e64980);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 13px 28px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(230, 73, 128, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.45s ease;
    }

    .btn-soft:hover {
      transform: translateY(-2px);
    }

    .btn-soft:active {
      transform: scale(0.96);
    }

    .btn-soft.hidden-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .cake-box {
      font-size: 6.4rem;
      line-height: 1.1;
      margin: 18px auto 14px;
      cursor: pointer;
      display: inline-block;
      filter: drop-shadow(0 12px 22px rgba(230, 73, 128, 0.22));
      transition: transform 0.25s ease;
      user-select: none;
    }

    .cake-box:hover {
      transform: scale(1.07);
    }

    .countdown-area {
      min-height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .slow-num {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 4.2rem;
      font-weight: 700;
      color: #b51753;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.85s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slow-num.show {
      opacity: 1;
      transform: scale(1.08);
    }

    .slow-num.fade-out {
      opacity: 0;
      transform: scale(1.25);
    }

    .wish-reveal {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #b51753;
      line-height: 1.35;
      animation: screenFadeIn 1.1s ease forwards;
    }

    .big-wish {
      font-size: 1.85rem;
      font-weight: 700;
      color: #b51753;
      line-height: 1.4;
      margin: 14px 0 24px;
    }

    .sorry-card {
      background: rgba(255, 243, 248, 0.92);
      border: 1px solid #ffc7de;
      border-radius: 22px;
      padding: 24px 18px;
      margin-bottom: 24px;
    }

    .sorry-line-1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #b51753;
      margin-bottom: 10px;
    }

    .sorry-line-2 {
      font-size: 1.05rem;
      font-style: italic;
      color: #7c3552;
    }

    .letter-header {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.3rem;
      color: #b51753;
      margin-bottom: 14px;
    }

    .letter-scroll-box {
      max-height: 330px;
      overflow-y: auto;
      text-align: left;
      padding: 22px 20px;
      border-radius: 22px;
      background: linear-gradient(180deg, #fffafd 0%, #fff0f6 100%);
      border: 1.5px solid #ffc6de;
      box-shadow: inset 0 2px 12px rgba(230, 73, 128, 0.08);
      scroll-behavior: smooth;
      margin-bottom: 20px;
    }

    .letter-line {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: 1.06rem;
      line-height: 1.65;
      color: #4b142a;
      margin-bottom: 14px;
      min-height: 1.4em;
    }

    .letter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background: #e64980;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blinkCursor 0.85s infinite;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .single-promise-box {
      padding: 44px 16px;
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.92), rgba(255, 222, 236, 0.85));
      border: 1.5px solid #ffb8d6;
      margin-bottom: 24px;
    }

    .single-promise-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.65rem;
      font-weight: 700;
      color: #b51753;
      line-height: 1.45;
    }

    .special-intro-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.55rem;
      color: #b51753;
      margin-bottom: 22px;
    }

    .big-heart-trigger {
      font-size: 5rem;
      cursor: pointer;
      display: inline-block;
      animation: gentlePulse 2s ease-in-out infinite;
      user-select: none;
    }

    .click-me-tag {
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e64980;
    }

    .reason-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: #7c3552;
      margin-bottom: 12px;
    }

    .reason-heart-btn {
      font-size: 4.5rem;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.25s ease;
      user-select: none;
      margin: 6px 0;
    }

    .reason-heart-btn:hover {
      transform: scale(1.1);
    }

    .reason-click-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e64980;
      margin-bottom: 14px;
    }

    .reason-reveal-card {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 245, 250, 0.95);

      font-weight: 600;
      font-style: italic;
      color: #b51753;
      line-height: 1.5;
      margin-bottom: 20px;
